<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Satheesh Meadi — Intelligence, rooted in the field.</title>
  <desc id="desc">Forest green and ivory profile banner with a center-pivot irrigation system above green crop rows, blue sprinkler droplets, and orange details.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#c8d5b1" stroke-opacity=".06"/></pattern>
    <clipPath id="landscape"><rect x="740" y="40" width="500" height="320" rx="30"/></clipPath>
    <linearGradient id="row-fade" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#82bc58"/><stop offset=".55" stop-color="#b5e578"/><stop offset="1" stop-color="#82bc58"/></linearGradient>
  </defs>
  <rect width="1280" height="420" rx="16" fill="#122b22"/>
  <rect width="1280" height="420" rx="16" fill="url(#grid)"/>
  <rect x="52" y="48" width="36" height="4" rx="2" fill="#fe5c00"/>
  <text x="103" y="55" font-family="Arial, sans-serif" font-size="13" letter-spacing="3" fill="#d5dfc4">RESEARCH WITH ROOTS</text>
  <text x="52" y="137" font-family="Arial, sans-serif" font-weight="700" font-size="58" letter-spacing="-2" fill="#f6f3e8">Satheesh Meadi</text>
  <text x="52" y="207" font-family="Georgia, serif" font-size="43" fill="#f6f3e8">Intelligence,</text>
  <text x="52" y="260" font-family="Georgia, serif" font-style="italic" font-size="43" fill="#c8d5b1">rooted in the field.</text>
  <text x="52" y="318" font-family="Arial, sans-serif" font-size="16" fill="#d5dfc4">Agricultural water · Geospatial intelligence · Applied AI</text>
  <path d="M52 350H640" stroke="#c8d5b1" stroke-opacity=".25"/>
  <text x="52" y="379" font-family="Arial, sans-serif" font-size="12" letter-spacing="2" fill="#c8d5b1">OKLAHOMA STATE UNIVERSITY</text>
